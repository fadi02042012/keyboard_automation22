name: keyboard_automation
description: "Professional Windows keyboard and mouse automation application with macro recording and modular workflow services."
publish_to: 'none'
version: 1.3.15+32

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # مكتبات التخزين والملفات (مهمة جداً لكي يعمل الحفظ والتصدير)
  shared_preferences: ^2.5.5
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # مكتبة أيقونات التطبيق
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ملاحظة هامة: يجب أن تتأكد من وجود مجلد assets/icon 
  # وبداخله صورة باسم app_icon.png لكي لا يعطي خطأ عند بناء التطبيق
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
